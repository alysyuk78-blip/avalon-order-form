    function calcPrice({ construction_type, basket_type, quantity, size_w, size_h, size_d, pattern, has_cover }) {
      const w = Number(size_w) || 0;
      const h = Number(size_h) || 0;
      const d = Number(size_d) || 0;
      const qty = Number(quantity) || 1;
      if (!w || !h || !qty) return null;
      const basketAreaM2 = (w * h + 2 * d * h) / 1_000_000;
      const coverAreaM2 = has_cover ? (w * d) / 1_000_000 : 0;
      const areaM2 = basketAreaM2 + coverAreaM2;
      // Base price depends on construction type
      const isDetachable = construction_type?.toLowerCase().includes("розбірний");
      let basketCostPerM2 = isDetachable ? COST_PER_M2_DETACHABLE : COST_PER_M2_SOLID;
      if (basket_type?.toLowerCase().includes("антивандал")) basketCostPerM2 *= 1.35;
      if (pattern && COMPLEX_PATTERNS.includes(pattern)) basketCostPerM2 *= 1.15;
      basketCostPerM2 = Math.round(basketCostPerM2);
      const basketPricePerM2 = Math.round(basketCostPerM2 * MARKUP);
      const coverPricePerM2 = Math.round(COVER_COST_PER_M2 * MARKUP);
      const basketPricePerUnit = Math.round(basketAreaM2 * basketPricePerM2 * 100) / 100;
      const coverPricePerUnit = Math.round(coverAreaM2 * coverPricePerM2 * 100) / 100;
      const perUnit = basketPricePerUnit + coverPricePerUnit;
      const total = Math.round(perUnit * qty * 100) / 100;
      const prepayment = Math.round(total * 0.5 * 100) / 100;
      // Внутрішні показники для менеджера (Telegram/Sheets):
      const basketCostTotal = Math.round(basketAreaM2 * basketCostPerM2 * qty);
      const coverCostTotal = Math.round(coverAreaM2 * COVER_COST_PER_M2 * qty);
      const costTotal = basketCostTotal + coverCostTotal;
      const profit = Math.round(total - costTotal);    // прибуток
      return {
        total, prepayment, perUnit, areaM2: Math.round(areaM2 * 1000) / 1000,
        pricePerM2: basketPricePerM2, costTotal, profit,
        basketAreaM2: Math.round(basketAreaM2 * 1000) / 1000,
        coverAreaM2: Math.round(coverAreaM2 * 1000) / 1000,
        basketCostPerM2, coverCostPerM2: COVER_COST_PER_M2,
        basketCostTotal, coverCostTotal,

    const roundUp10 = (v) => Math.ceil(v / 10) * 10;
    function basketFromAC({ ac_w, ac_h, ac_d, coversBrackets = false }) {
      const W = Number(ac_w) || 0, H = Number(ac_h) || 0, D = Number(ac_d) || 0;
      if (!W || !H || !D) return null;
      const FRONT_GAP = 50;
      const wallGap = 150; // стандартний мінімальний зазор до стіни
      // Глибина: кронштейн має бути ≥ глибина блоку + зазор до стіни; беремо найближчий стандартний (К1–К4).
      const required = D + wallGap;
      const bracket = BRACKET_LENGTHS.find(b => b >= required) || required;
      const size_d = roundUp10(bracket + FRONT_GAP);          // глибина = кронштейн + 50
      const size_w = roundUp10(W + 100);                       // ширина = блок + по 50 з боків
      let size_h = H;
      if (coversBrackets) size_h += 120;                       // +120 якщо кошик закриває кронштейни
      size_h = roundUp10(size_h);
      return { size_w, size_h, size_d, bracket };
    }

    function fmt(n) {
      return n.toLocaleString("uk-UA", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // Складання адреси з вулиці / будинку / під'їзду
    function composeAddr(street, house, entrance) {
      const parts = [];
      if (street && street.trim()) parts.push("вул. " + street.trim());
      if (house && house.trim()) parts.push("буд. " + house.trim());
      if (entrance && entrance.trim()) parts.push("під'їзд " + entrance.trim());
      return parts.join(", ");
    }

    // ============================================================
    // WORKING DAYS / DELIVERY DATE
    // ============================================================
    function addWorkingDays(startDate, days) {
      // startDate is day 1 (inclusive), count total of `days` working days
      let date = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate());
      let counted = 1; // startDate itself is day 1
      while (counted < days) {
        date.setDate(date.getDate() + 1);
        const dow = date.getDay();
        if (dow !== 0 && dow !== 6) counted++;
      }
      return date;
    }

    function getMinDeliveryDate() {
      const now = new Date();
      // Якщо оплату здійснено до 13:00 — відлік з сьогодні, після 13:00 — з наступного робочого дня
      const beforeCutoff = now.getHours() < 13;
      let startDay = beforeCutoff ? new Date(now.getFullYear(), now.getMonth(), now.getDate()) : new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
      // Якщо стартовий день — вихідний, зсуваємо на понеділок
      while (startDay.getDay() === 0 || startDay.getDay() === 6) {
        startDay = new Date(startDay.getFullYear(), startDay.getMonth(), startDay.getDate() + 1);
      }
      const min = addWorkingDays(startDay, 5);
      min.setHours(0, 0, 0, 0);
      return min;
    }

    // ============================================================
    // NOVA POSHTA API (через серверний проксі /api/np)
    // ============================================================
    const NP_PROXY_URL = "/api/np";
    const NP_ERROR_MSG = "Сервіс Нової пошти тимчасово недоступний. Спробуйте пізніше або введіть № відділення / адресу вручну.";

    async function npSearchCities(query) {
      if (!query || query.length < 2) return [];
      // Помилки мережі/проксі НЕ глушимо — кидаємо, щоб UI показав «сервіс недоступний».
      const res = await fetch(NP_PROXY_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          modelName: "AddressGeneral",
          calledMethod: "searchSettlements",
          methodProperties: { CityName: query, Limit: "20", Page: "1" }
        })
      });
      if (!res.ok) throw new Error("NP proxy HTTP " + res.status);
      const data = await res.json();
      if (data.success && data.data && data.data[0] && data.data[0].Addresses) {
        return data.data[0].Addresses.map(a => ({
          ref: a.DeliveryCity,
          name: a.Present,
          mainDescription: a.MainDescription,
          area: a.Area,
          region: a.Region
        }));
      }
      return [];
    }

    async function npSearchWarehouses(cityRef, query) {
      if (!cityRef) return [];
      const props = { CityRef: cityRef, Limit: "150", Page: "1" };
      if (query && query.length > 0) props.FindByString = query;
      // Помилки мережі/проксі НЕ глушимо — кидаємо, щоб UI показав «сервіс недоступний».
      const res = await fetch(NP_PROXY_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          modelName: "Address",
          calledMethod: "getWarehouses",
          methodProperties: props
        })
      });
      if (!res.ok) throw new Error("NP proxy HTTP " + res.status);
      const data = await res.json();
      if (data.success && data.data) {
        return data.data.map(w => ({
          ref: w.Ref,
          description: w.Description,
          shortAddress: w.ShortAddress,
          number: w.Number,
          typeOfWarehouse: w.TypeOfWarehouse,
          categoryOfWarehouse: w.CategoryOfWarehouse,
          totalMaxWeight: parseFloat(w.TotalMaxWeightAllowed) || 0,
          placeMaxWeight: parseFloat(w.PlaceMaxWeightAllowed) || 0
        }));
      }
      return [];
    }

    const NP_MIN_WEIGHT_KG = 30;

    // Кошик — важкий/габаритний вантаж. Лишаємо лише відділення, що його приймають:
    // ховаємо поштомати (за категорією/назвою) та відділення з лімітом на 1 місце < 30 кг.
    // placeMaxWeight === 0 трактуємо як «без явного ліміту» (вантажне відділення) → лишаємо.
    function npIsPostomat(w) {
      const cat = (w.categoryOfWarehouse || "").toLowerCase();
      const desc = (w.description || "").toLowerCase();
      return cat === "postomat" || desc.includes("поштомат");
    }
    function npAcceptsBasket(w) {
      if (npIsPostomat(w)) return false;
      const limit = w.placeMaxWeight; // PlaceMaxWeightAllowed — макс. вага на одне місце
      return !(limit > 0 && limit < NP_MIN_WEIGHT_KG);
    }

    // ============================================================
    // NP AUTOCOMPLETE COMPONENT
    // ============================================================
    function NpAutocomplete({ placeholder, value, onSearch, onSelect, renderItem, noResultsText = "Нічого не знайдено", minChars = 2 }) {
      const [query, setQuery] = useState(value || "");
      const [results, setResults] = useState([]);
      const [loading, setLoading] = useState(false);
      const [open, setOpen] = useState(false);
      const [focused, setFocused] = useState(false);
      const [npError, setNpError] = useState(false);
      const wrapperRef = useRef(null);
      const debounceRef = useRef(null);

      useEffect(() => { setQuery(value || ""); }, [value]);

      useEffect(() => {
        function handleClickOutside(e) {
          if (wrapperRef.current && !wrapperRef.current.contains(e.target)) {
            setOpen(false);
          }
        }
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, []);

      const handleInput = (text) => {
        setQuery(text);
        onSelect(null, text);
        if (debounceRef.current) clearTimeout(debounceRef.current);
        if (text.length >= minChars) {
          setLoading(true);
          debounceRef.current = setTimeout(async () => {
            try {
              const items = await onSearch(text);
              setResults(items);
              setNpError(false);
            } catch (e) {
              console.error("NP search error:", e);
              setResults([]);
              setNpError(true);
            }
            setLoading(false);
            setOpen(true);
          }, 350);
        } else {
          setResults([]);
          setOpen(false);
          setLoading(false);
        }
      };

      const handleSelect = (item) => {
        onSelect(item);
        setOpen(false);
      };

      const dropdownStyle = {
        position: "absolute", top: "100%", left: 0, right: 0,
        zIndex: 1000, backgroundColor: "#fff", border: "1px solid #d1d5db",
        borderTop: "none", borderRadius: "0 0 8px 8px",
        maxHeight: "220px", overflowY: "auto",
        boxShadow: "0 4px 16px rgba(0,0,0,0.10)"
      };

      const itemStyle = (isHover) => ({
        padding: "10px 12px", cursor: "pointer", fontSize: "13px",
        borderBottom: "1px solid #f3f4f6", lineHeight: "1.4",
        backgroundColor: isHover ? "#f2f3f4" : "transparent",
        transition: "background 0.15s"
      });

      return (
        <div ref={wrapperRef} style={{ position: "relative" }}>
          <div style={{ position: "relative" }}>
            <input
              type="text"
              value={query}
              onChange={e => handleInput(e.target.value)}
              onFocus={() => { setFocused(true); if (results.length > 0 && query.length >= minChars) setOpen(true); }}
              placeholder={placeholder}
              className="w-full px-3 py-2 rounded-lg border text-sm"
              style={{ borderColor: focused ? "#383E42" : "#d1d5db", backgroundColor: "#fff", outline: "none", paddingRight: "32px" }}
              onBlur={() => setFocused(false)}
            />
            {loading && (
              <div style={{ position: "absolute", right: "10px", top: "50%", transform: "translateY(-50%)" }}>
                <svg width="16" height="16" viewBox="0 0 24 24" style={{ animation: "spin 1s linear infinite" }}>
                  <circle cx="12" cy="12" r="10" stroke="#383E42" strokeWidth="3" fill="none" strokeDasharray="30 70" strokeLinecap="round"/>
                </svg>
              </div>
            )}
            {!loading && value && (
              <div style={{ position: "absolute", right: "10px", top: "50%", transform: "translateY(-50%)", color: "#383e42" }}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M20 6 9 17l-5-5"/>
                </svg>
              </div>
            )}
          </div>
          {open && (
            <div style={dropdownStyle}>
              {npError && !loading && (
                <div style={{ padding: "12px", color: "#b45309", backgroundColor: "#fffbeb", fontSize: "12px", lineHeight: 1.4 }}>⚠️ {NP_ERROR_MSG}</div>
              )}
              {!npError && results.length === 0 && !loading && query.length >= minChars && (
                <div style={{ padding: "12px", color: "#9CA3AF", fontSize: "13px", textAlign: "center" }}>{noResultsText}</div>
              )}
              {results.map((item, i) => (
                <div
                  key={i}
                  style={itemStyle(false)}
                  onMouseEnter={e => e.currentTarget.style.backgroundColor = "#f2f3f4"}
                  onMouseLeave={e => e.currentTarget.style.backgroundColor = "transparent"}
                  onMouseDown={(e) => { e.preventDefault(); handleSelect(item); }}
                >
                  {renderItem ? renderItem(item) : item.name || item.description}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // NP CITY SEARCH COMPONENT
    // ============================================================
    function NpCitySearch({ value, cityRef, onSelect }) {
      // Авто-привʼязка: якщо місто вже введене (напр. з блоку 1), але ще НЕ обране з
      // довідника НП (cityRef порожній) — самі знаходимо збіг і підставляємо, щоб
      // відділення вантажились одразу, без ручного редагування назви.
      const autoTried = useRef("");
      useEffect(() => {
        const city = (value || "").trim();
        if (!city || cityRef) return;
        const key = city.toLowerCase();
        if (autoTried.current === key) return; // не шукати повторно для того самого тексту
        autoTried.current = key;
        const norm = (s) => String(s || "").toLowerCase().replace(/^м\.?\s*/, "").trim();
        const target = norm(city);
        npSearchCities(city).then((list) => {
          if (!list || !list.length) return;
          const pick = list.find((it) => norm(it.mainDescription) === target || norm(it.name) === target)
                    || (list.length === 1 ? list[0] : null);
          if (pick) onSelect({ name: pick.mainDescription, ref: pick.ref, fullName: pick.name });
        }).catch(() => {});
      }, [value, cityRef]);

      return (
        <NpAutocomplete
          placeholder="Почніть вводити назву міста..."
          value={value}
          onSearch={npSearchCities}
          onSelect={(item, text) => {
            if (item) {
              onSelect({ name: item.mainDescription, ref: item.ref, fullName: item.name });
            } else {
              onSelect({ name: text || "", ref: "", fullName: "" });
            }
          }}
          renderItem={(item) => (
            <div>
              <div style={{ fontWeight: 500, color: "#383E42" }}>{item.mainDescription}</div>
              <div style={{ fontSize: "11px", color: "#6b7280", marginTop: "2px" }}>{item.area}, {item.region}</div>
            </div>
          )}
          noResultsText="Місто не знайдено"
        />
      );
    }

    // ============================================================
    // NP WAREHOUSE SEARCH COMPONENT
    // ============================================================
    function NpWarehouseSearch({ cityRef, value, onSelect }) {
      const [loaded, setLoaded] = useState(false);
      const [allWarehouses, setAllWarehouses] = useState([]);
      const [totalBefore, setTotalBefore] = useState(0);
      const [loadError, setLoadError] = useState(false);

      useEffect(() => {
        setLoaded(false);
        setAllWarehouses([]);
        setTotalBefore(0);
        setLoadError(false);
        if (cityRef) {
          npSearchWarehouses(cityRef, "").then(raw => {
            setTotalBefore(raw.length);
            const filtered = raw.filter(npAcceptsBasket);
            setAllWarehouses(filtered);
            setLoaded(true);
          }).catch(err => {
            console.error("NP warehouses load error:", err);
            setLoadError(true);
            setLoaded(true);
          });
        }
      }, [cityRef]);

      if (!cityRef) {
        return (
          <input
            type="text" disabled
            placeholder="Спочатку оберіть місто"
            className="w-full px-3 py-2 rounded-lg border text-sm"
            style={{ borderColor: "#d1d5db", backgroundColor: "#f9fafb", color: "#9CA3AF" }}
          />
        );
      }

      const excluded = totalBefore - allWarehouses.length;

      return (
        <div>
          <NpAutocomplete
            placeholder={loadError ? "Введіть № відділення або адресу вручну" : (loaded ? `${allWarehouses.length} відділень (від ${NP_MIN_WEIGHT_KG} кг) — введіть номер...` : "Завантаження відділень...")}
            value={value}
            minChars={0}
            onSearch={async (q) => {
              if (!q || q.length === 0) return allWarehouses.slice(0, 50);
              const lc = q.toLowerCase();
              const filtered = allWarehouses.filter(w =>
                w.description.toLowerCase().includes(lc) || (w.number && w.number.toString().includes(q))
              );
              if (filtered.length > 0) return filtered.slice(0, 50);
              const remote = await npSearchWarehouses(cityRef, q);
              return remote.filter(npAcceptsBasket);
            }}
            onSelect={(item, text) => {
              if (item) {
                onSelect(item.description);
              } else {
                onSelect(text || "");
              }
            }}
            renderItem={(item) => (
              <div>
                <div style={{ fontWeight: 500, color: "#111" }}>{item.description}</div>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: "2px" }}>
                  {item.shortAddress && <span style={{ fontSize: "11px", color: "#6b7280" }}>{item.shortAddress}</span>}
                  <span style={{ fontSize: "10px", color: "#383e42", fontWeight: 500, whiteSpace: "nowrap", marginLeft: "8px" }}>{item.placeMaxWeight > 0 ? `до ${item.placeMaxWeight} кг` : "вантажне"}</span>
                </div>
              </div>
            )}
            noResultsText="Відділення не знайдено"
          />
          {loaded && excluded > 0 && (
            <div style={{ marginTop: "4px", fontSize: "11px", color: "#d97706", display: "flex", alignItems: "center", gap: "4px" }}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
              Приховано {excluded} поштоматів/відділень з обмеженням ваги до {NP_MIN_WEIGHT_KG} кг
            </div>
          )}
          {loadError && (
            <div style={{ marginTop: "4px", fontSize: "11px", color: "#b45309", lineHeight: 1.4 }}>⚠️ {NP_ERROR_MSG}</div>
          )}
        </div>
      );
    }

    function StyledSelect({ value, onChange, placeholder, error, children, ...props }) {
      const [open, setOpen] = useState(false);
      const [pos, setPos] = useState({ top: 0, left: 0, width: 0 });
      const btnRef = useRef(null);
      const dropRef = useRef(null);
      const options = React.Children.toArray(children).map(c => ({ value: c.props.value, label: c.props.children }));
      const selected = options.find(o => o.value === value);

      useEffect(() => {
        const handler = (e) => {
          if (btnRef.current && !btnRef.current.contains(e.target) && dropRef.current && !dropRef.current.contains(e.target)) setOpen(false);
        };
        document.addEventListener("mousedown", handler);
        return () => document.removeEventListener("mousedown", handler);
      }, []);

      const handleOpen = () => {
        if (!open && btnRef.current) {
          const rect = btnRef.current.getBoundingClientRect();
          setPos({ top: rect.bottom + 4, left: rect.left, width: rect.width });
        }
        setOpen(!open);
      };

      return (
        <div>
          <button ref={btnRef} type="button" onClick={handleOpen}
            onKeyDown={e => {
              if (e.key === "Escape") setOpen(false);
              if (e.key === "ArrowDown" && !open) { e.preventDefault(); handleOpen(); }
            }}
            aria-haspopup="listbox" aria-expanded={open} {...props}
            className={`w-full flex items-center justify-between rounded-lg border px-3 py-2 text-sm text-left transition-all ${error ? "field-error" : ""}`}
            style={{
              borderColor: error ? "#ef4444" : open ? "#383E42" : "#d1d5db",
              backgroundColor: error ? "#fff5f5" : "#fff",

            }}>
            <span style={{ color: selected ? "#111" : "#9CA3AF" }}>{selected ? selected.label : (placeholder || "Оберіть...")}</span>
            <IconChevronDown style={{ color: "#6B7280", transition: "transform 0.2s", transform: open ? "rotate(180deg)" : "rotate(0)", flexShrink: 0 }} />
          </button>
          {open && ReactDOM.createPortal(
            <div ref={dropRef} role="listbox" style={{
              position: "fixed", top: pos.top, left: pos.left, width: pos.width, zIndex: 9999,
              background: "#fff", border: "1px solid #e2e0dc", borderRadius: 10,
              boxShadow: "0 8px 24px rgba(0,0,0,0.12)", maxHeight: 220, overflowY: "auto"
            }}>
              {options.map(o => (
                <div key={o.value} role="option" aria-selected={o.value === value} tabIndex={0}
                  onClick={() => { onChange(o.value); setOpen(false); }}
                  onKeyDown={e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onChange(o.value); setOpen(false); } }}
                  className="cursor-pointer transition-colors"
                  style={{
                    padding: "10px 14px", fontSize: 14,
                    backgroundColor: o.value === value ? "#f2f2f2" : "transparent",
                    color: o.value === value ? "#383E42" : "#374151",
                    fontWeight: o.value === value ? 600 : 400
                  }}
                  onMouseEnter={e => { if (o.value !== value) e.currentTarget.style.backgroundColor = "#f4f4f5"; }}
                  onMouseLeave={e => { if (o.value !== value) e.currentTarget.style.backgroundColor = "transparent"; }}>
                  {o.value === value && <span style={{ marginRight: 8, color: "#383E42" }}>✓</span>}
                  {o.label}
                </div>
              ))}
            </div>,
            document.body
          )}
        </div>
      );
    }

    function CalendarPicker({ selected, onSelect, minDate, onClose }) {
      const [viewDate, setViewDate] = useState(() => selected ? new Date(selected) : new Date(minDate));
      const DAYS_UK = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Нд"];
      const MONTHS_UK = ["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];
      const year = viewDate.getFullYear();
      const month = viewDate.getMonth();
      const firstDay = new Date(year, month, 1);
      let startDow = firstDay.getDay() - 1;
      if (startDow < 0) startDow = 6;
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const today = new Date();
      today.setHours(0,0,0,0);

      const cells = [];
      for (let i = 0; i < startDow; i++) cells.push(null);
      for (let d = 1; d <= daysInMonth; d++) cells.push(d);

      const prev = () => setViewDate(new Date(year, month - 1, 1));
      const next = () => setViewDate(new Date(year, month + 1, 1));

      return (
        <div className="cal-overlay" onClick={onClose}>
          <div className="cal-modal" onClick={e => e.stopPropagation()}>
            <div className="cal-header">
              <button type="button" className="cal-nav" onClick={prev}>‹</button>
              <span style={{ fontWeight: 700, color: "#383E42", fontSize: 15 }}>{MONTHS_UK[month]} {year}</span>
              <button type="button" className="cal-nav" onClick={next}>›</button>
            </div>
            <div className="cal-grid">
              {DAYS_UK.map(d => <div key={d} className="cal-day-label">{d}</div>)}
              {cells.map((day, i) => {
                if (!day) return <div key={`e${i}`} />;
                const date = new Date(year, month, day);
                date.setHours(0,0,0,0);
                const minNorm = new Date(minDate);
                minNorm.setHours(0,0,0,0);
                const isWeekend = date.getDay() === 0 || date.getDay() === 6;
                const disabled = date < minNorm || isWeekend;
                const isToday = date.getTime() === today.getTime();
                const isSelected = selected && new Date(selected).toDateString() === date.toDateString();
                return (
                  <button key={day} type="button" disabled={disabled}
                    className={`cal-day ${isSelected ? "selected" : ""} ${isToday ? "today" : ""}`}
                    onClick={() => { onSelect(date); onClose(); }}>
                    {day}
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // Generate order number: ORD-DDMMYY-XXX
    function generateOrderNumber() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, "0");
      const mm = String(now.getMonth() + 1).padStart(2, "0");
      const yy = String(now.getFullYear()).slice(-2);
      const xxx = String(Math.floor(Math.random() * 900) + 100);
      return `ORD-${dd}${mm}${yy}-${xxx}`;
    }

    function formatDeliveryDate(dateStr) {
      if (!dateStr) return "—";
      const d = new Date(dateStr);
      return d.toLocaleDateString("uk-UA", { day: "2-digit", month: "2-digit", year: "numeric" });

    async function submitOrder(order) {
      // Submit to server-side API (keys are stored as env vars on Vercel)
      const res = await fetch(CONFIG.API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(order),
      });
      if (!res.ok) throw new Error("Server error: " + res.status);
      return await res.json();
    }

    const MAX_PATTERN_FILE_BYTES = 4 * 1024 * 1024;

    function fileToOrderPayload(file) {
      return new Promise((resolve, reject) => {
        if (!file) return resolve(null);
        if (file.size > MAX_PATTERN_FILE_BYTES) {
          return reject(new Error("Файл візерунку завеликий. Максимум 4 МБ."));
        }
        const reader = new FileReader();
        reader.onload = () => {
          const result = String(reader.result || "");
          const comma = result.indexOf(",");
          resolve({
            name: file.name,
            type: file.type || "application/octet-stream",
            size: file.size,
            data: comma >= 0 ? result.slice(comma + 1) : result,
          });
        };
        reader.onerror = () => reject(new Error("Не вдалося прочитати файл візерунку."));
        reader.readAsDataURL(file);
      });
    }

    // ============================================================
    // PHONE MASK HELPER
    // ============================================================
    function formatPhoneUA(value) {
      // Strip all non-digits
      let digits = value.replace(/\D/g, "");
      // If starts with 380, keep as is; if starts with 0, prepend 38; if starts with 8, prepend 3
      if (digits.startsWith("380")) { /* ok */ }
      else if (digits.startsWith("80")) digits = "3" + digits;
      else if (digits.startsWith("0")) digits = "38" + digits;
      // Limit to 12 digits (380XXXXXXXXX)
      digits = digits.slice(0, 12);
      // Format: +380 XX XXX XX XX
      let formatted = "+";
      if (digits.length > 0) formatted += digits.slice(0, 3);
      if (digits.length > 3) formatted += " " + digits.slice(3, 5);
      if (digits.length > 5) formatted += " " + digits.slice(5, 8);
      if (digits.length > 8) formatted += " " + digits.slice(8, 10);
      if (digits.length > 10) formatted += " " + digits.slice(10, 12);
      return formatted;
    }

    function isValidPhoneUA(value) {
      const digits = value.replace(/\D/g, "");
      return digits.length === 12 && digits.startsWith("380");
    }

      // Autosave on form change (debounced)
      const saveTimerRef = useRef(null);

        return () => { if (saveTimerRef.current) clearTimeout(saveTimerRef.current); };
      }, [form, items, submitted]);

      useEffect(() => {
        if (!submitted) saveDraftItems(items);
      }, [items, submitted]);

      // Field-level validation
      const fieldError = (field) => {
        if (!showErrors && !touched[field]) return false;
        const basketFields = ["construction_type", "basket_type", "quantity", "color", "color_custom", "pattern", "size_w", "size_h", "size_d", "ac_brand", "ac_model", "covers_brackets"];
        if (basketFields.includes(field) && items.length > 0 && !basketTouched) return false;
        switch (field) {
          case "first_name": return !form.first_name.trim();
          case "phone": return !form.phone.trim() || !isValidPhoneUA(form.phone);
          case "construction_type": return !form.construction_type;
          case "basket_type": return !form.basket_type;
          case "quantity": return !(Number(form.quantity) >= 1);
          case "color": return !form.color;
          case "color_custom": return (form.color === "Інші кольори" || form.color === "Інший") && !(form.color_custom || "").trim();
          case "pattern": return !form.pattern;
          case "size_w": return sizeMode !== "model" && !(Number(form.size_w) > 0);
          case "size_h": return sizeMode !== "model" && !(Number(form.size_h) > 0);
          case "size_d": return sizeMode !== "model" && !(Number(form.size_d) > 0);
          case "ac_brand": return sizeMode === "model" && !(form.ac_brand || "").trim();
          case "ac_model": return sizeMode === "model" && !(form.ac_model || "").trim();
          case "covers_brackets": return sizeMode === "ac" && coversBrackets === null;
          case "delivery_location": return !form.delivery_location;
          case "transport": return !form.transport;
          case "delivery_date": return !form.delivery_date;
          case "del_street": return (form.transport || "").includes("Адресна") && !(form.del_street || "").trim();
          case "del_house": return (form.transport || "").includes("Адресна") && !(form.del_house || "").trim();
          case "payment_method": return !form.payment_method;
          case "how_found": return !form.how_found;
          case "how_found_custom": return form.how_found === "Інше" && !(form.how_found_custom || "").trim();
          case "terms_accepted": return !form.terms_accepted;
          default: return false;
        }
      };

      // ── Мультипозиційність: поточний кошик + список доданих ──
      // Розмір можна задати РОЗМІРОМ КОШИКА, ГАБАРИТАМИ БЛОКУ або БРЕНД+МОДЕЛЬ.
      const hasSize = (s) => Number(s.size_w) > 0 && Number(s.size_h) > 0 && Number(s.size_d) > 0;

      const basketComplete = (s) =>

      const basketTouched = !!(form.construction_type || form.basket_type || form.color || form.pattern ||

          setToast({ message, type: "error" });

        setShowErrors(false);
        setCurrentStep(nextStep);

      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (submittingRef.current) return; // вже відправляється — ігноруємо повторний клік
        if (!isFormValid) {
          setShowErrors(true);
          let msg = "Заповніть всі обов'язкові поля, позначені *";
          if (commonValid && basketTouched) msg = "Натисніть «Додати кошик», щоб додати поточний кошик до замовлення";
          else if (commonValid && items.length === 0) msg = "Додайте кошик: заповніть параметри і натисніть «Додати кошик»";
          setToast({ message: msg, type: "error" });
          const el = document.querySelector(".field-error");
          if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
          else document.getElementById("add-basket")?.scrollIntoView({ behavior: "smooth", block: "center" });
          return;
        }
        setShowErrors(false);
        submittingRef.current = true;
        setSubmitting(true);
        const orderItems = items;
        const grand = orderItems.reduce((s, it) => s + (it.price_total || 0), 0);
        const costSum = orderItems.reduce((s, it) => s + (it.cost_total || 0), 0);
        const profitSum = orderItems.reduce((s, it) => s + (it.profit || 0), 0);
        const f0 = orderItems[0];
        let patternFilePayload = null;
        try {
          patternFilePayload = await fileToOrderPayload(patternFile);
        } catch (err) {
          setToast({ message: err.message || "Не вдалося підготувати файл візерунку.", type: "error" });
          setSubmitting(false);
          submittingRef.current = false;
          return;
        }
        const order = {
          first_name: form.first_name.trim(), last_name: form.last_name.trim(),
          phone: form.phone.trim(), city: form.city.trim(),
          transport: form.transport, transport_custom: form.transport_custom,
          delivery_address: form.delivery_address, delivery_location: form.delivery_location,
          delivery_date: form.delivery_date, payment_method: form.payment_method,
          how_found: form.how_found, how_found_custom: form.how_found_custom, notes: form.notes,
          referral_source: form.referral_source || "direct",
          items: orderItems,
          price_total: grand, prepayment: Math.round(grand * 0.5), cost_total: costSum, profit: profitSum,
          pattern_file: patternFilePayload,
          // сумісність зі старим форматом (перша позиція):
          size_w: f0.size_w, size_h: f0.size_h, size_d: f0.size_d, quantity: f0.quantity,
          construction_type: f0.construction_type, basket_type: f0.basket_type,
          color: f0.color, color_custom: f0.color_custom, pattern: f0.pattern, pattern_custom: f0.pattern_custom,
          ac_brand: f0.ac_brand, ac_model: f0.ac_model,
          block_w: f0.block_w, block_h: f0.block_h, block_d: f0.block_d,
        };
        try {
          await submitOrder(order);
          setSubmitted(true);
          clearDraft();
          setHasDraft(false);
        } catch (err) {
          console.error(err);
          setToast({ message: "Помилка при відправці. Спробуйте ще раз або зателефонуйте нам.", type: "error" });
          // Сповістити власника з даними замовлення — щоб не загубити клієнта
          try { if (window.__alertOwner) window.__alertOwner("submit_failed", "Не вдалось надіслати замовлення: " + (err && err.message || err), JSON.stringify(order)); } catch (_) {}
        }
        setSubmitting(false);
        submittingRef.current = false;
      };

      const resetForm = () => {
        setSubmitted(false);
        setPatternFile(null);
        setNpCityRef("");
        setTouched({});
        setItems([]);
        setCurrentStep(1);
        setSizeMode("ac"); setAcDims({ w: "", h: "", d: "" });
        setCoversBrackets(null); setSelBrand(""); setSelModel("");
        clearDraft();
        setHasDraft(false);
        setForm({
          first_name: "", last_name: "", phone: "", city: "",
          construction_type: "", basket_type: "", quantity: "", has_cover: false,
          color: "", color_custom: "", pattern: "", pattern_custom: "",
          size_w: "", size_h: "", size_d: "", ac_brand: "", ac_model: "", block_w: "", block_h: "", block_d: "",
          transport: "", transport_custom: "", delivery_address: "", del_street: "", del_house: "", del_entrance: "", delivery_location: "",
          delivery_date: "", payment_method: "",
          terms_accepted: false, how_found: "", how_found_custom: "", notes: ""
        });
      };

      // ---- SUCCESS SCREEN ----
      if (submitted) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4" style={{ backgroundColor: "#f2f2f2" }}>
            <div className="bg-white rounded-2xl shadow-xl p-10 max-w-md w-full text-center">
              <div className="flex justify-center mb-4">
                <div className="w-16 h-16 rounded-full flex items-center justify-center" style={{ backgroundColor: "#383E42" }}>
                  <AvalonLogo size={40} tone="light" />
                </div>
              </div>
              <h2 className="text-2xl font-bold mb-2" style={{ color: "#383E42" }}>Дякуємо за замовлення!</h2>
              <p className="text-gray-600 mb-6">Ми зв'яжемось з вами найближчим часом для уточнення деталей та прорахунку вартості.</p>
              <button onClick={resetForm} className="text-white px-6 py-3 rounded-lg font-semibold" style={{ backgroundColor: "#383E42" }}>
                Нове замовлення
              </button>
            </div>
          </div>
        );
      }

      const formatDate = (dateStr) => {
        if (!dateStr) return null;
        const d = new Date(dateStr);
        return d.toLocaleDateString("uk-UA", { day: "2-digit", month: "2-digit", year: "numeric" });
      };

      // ---- MAIN FORM ----
      return (
        <div className="min-h-screen" style={{ backgroundColor: "#f2f2f2" }}>
          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
          <HelpWidget />
          {showCalendar && (
            <CalendarPicker
              selected={form.delivery_date ? new Date(form.delivery_date) : null}
              minDate={getMinDeliveryDate()}
              onSelect={date => {
                const y = date.getFullYear();
                const m = String(date.getMonth()+1).padStart(2,"0");
                const d = String(date.getDate()).padStart(2,"0");
                set("delivery_date", `${y}-${m}-${d}`);
              }}
              onClose={() => setShowCalendar(false)}
            />
          )}

          {/* Header */}
          <div className="py-12 px-4 text-center relative overflow-hidden header-glow" style={{ backgroundColor: "#383E42" }}>
            <div className="flex justify-center mb-5 fade-in"><AvalonLogo size={120} tone="light" /></div>
            <div className="gold-divider h-px w-32 mx-auto mb-6" />
            <h1 className="text-base md:text-lg font-semibold text-white uppercase tracking-widest mb-3 fade-in" style={{ animationDelay: "0.3s" }}>
              {SETTINGS.form_title}
            </h1>
            <p className="text-sm md:text-base max-w-xl mx-auto leading-relaxed italic fade-in" style={{ color: "#c4c8cc", animationDelay: "0.4s" }}>
              {SETTINGS.form_description}
            </p>
            <p className="text-xs mt-5 italic fade-in" style={{ color: "#c4c8cc", animationDelay: "0.5s" }}>* — обов'язкові поля</p>
          </div>

          {/* Progress Bar */}
          <ProgressBar currentStep={currentStep} completedSteps={completedSteps} onStepChange={goToStep} />

          <div className="max-w-2xl mx-auto px-4 pt-3">
            <details className="optional-details bg-white rounded-xl px-4" style={{ boxShadow: "0 2px 12px rgba(56,62,66,0.08)" }}>
              <summary><span>Коротка інструкція із заповнення</span><DisclosureMark /></summary>
              <ol className="list-decimal ml-5 pb-4 text-xs space-y-2" style={{ color: "#4B5563" }}>
                <li>Залиште ім'я та номер телефону для підтвердження замовлення.</li>
                <li>Налаштуйте кошик і натисніть «Додати цей кошик до замовлення».</li>
                <li>Оберіть доставку, оплату та вкажіть, звідки ви про нас дізналися.</li>
              </ol>
            </details>
          </div>

          {/* Draft restoration banner */}
          {hasDraft && !submitted && (
            <div className="max-w-2xl mx-auto px-4 pt-2">
              <div style={{ backgroundColor: "#f4f4f5", border: "1px solid #383E4240", borderRadius: 12, padding: "10px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontSize: 14, color: "#383E42" }}>&#9776;</span>
                  <span style={{ fontSize: 12, color: "#383E42" }}>Відновлено збережену чернетку</span>
                </div>
                <button type="button" onClick={() => { clearDraft(); setHasDraft(false); resetForm(); }} style={{ minHeight: 44, padding: "8px", fontSize: 11, color: "#383E42", background: "none", border: "none", cursor: "pointer", textDecoration: "underline" }}>Очистити</button>
              </div>
            </div>
          )}

          {/* Form */}
          <div id="form-start" className="max-w-2xl mx-auto px-4 py-8 space-y-4">
            <form onSubmit={handleSubmit} className="space-y-4">
              {/* Honeypot — invisible field to catch bots */}
              <div style={{ position: "absolute", left: "-9999px", opacity: 0, height: 0, overflow: "hidden" }} aria-hidden="true" tabIndex={-1}>
                <input type="text" name="_hp_field" value={form._hp_field || ""} onChange={e => set("_hp_field", e.target.value)} autoComplete="off" tabIndex={-1} />
                {/* Джерело заявки (?ref=) — приховане технічне поле для обліку ОСББ/партнер-рефералів */}
                <input type="hidden" name="referral_source" value={form.referral_source || "direct"} readOnly />
              </div>

              <section className="space-y-4" style={{ display: currentStep === 1 ? "block" : "none" }}>
              <StepIntro number="1" title="Контактні дані" description="Залиште номер, щоб менеджер міг підтвердити замовлення." />

              {/* Контактні дані */}
              <FormCard title="Контактні дані">
                <Field label="Ім'я *">
                  <StyledInput placeholder="Ваше ім'я" value={form.first_name} onChange={e => set("first_name", e.target.value)} onBlur={() => touch("first_name")} error={fieldError("first_name")} />
                </Field>
                <Field label="Прізвище">
                  <StyledInput placeholder="Ваше прізвище" value={form.last_name} onChange={e => set("last_name", e.target.value)} />
                </Field>
                <Field label="Номер телефону *">
                  <StyledInput aria-label="Номер телефону *" placeholder="+380 XX XXX XX XX" value={form.phone}
                    onChange={e => set("phone", formatPhoneUA(e.target.value))}
                    onBlur={() => touch("phone")}
                    error={fieldError("phone")} />
                  {touched.phone && form.phone.trim() && !isValidPhoneUA(form.phone) && (
                    <div style={{ marginTop: 4, fontSize: 11, color: "#ef4444" }}>Введіть коректний номер у форматі +380 XX XXX XX XX</div>
                  )}
                </Field>
                <Field label="Місто">
                  <StyledInput placeholder="Ваше місто" value={form.city} onChange={e => set("city", e.target.value)} />
                </Field>
              </FormCard>

              <div className="step-nav">
                <button type="button" className="step-nav-primary fx-btn" onClick={() => goToStep(2)}>Далі: налаштувати кошик</button>
              </div>
              </section>

              {/* Параметри кошика */}
              <section className="space-y-4" style={{ display: currentStep === 2 ? "block" : "none" }}>
              <StepIntro number="2" title="Налаштуйте кошик" description="Не знаєте розмірів? Просто вкажіть бренд і модель кондиціонера." />

              <FormCard title="Параметри кошика">
                <Field label="Конструкція кошика *" help="Суцільний кошик готовий до монтажу. Розбірний складається з трьох частин, його дешевше доставляти та зручніше монтувати.">
                  <StyledSelect value={form.construction_type} onChange={v => set("construction_type", v)} placeholder="Оберіть конструкцію" error={fieldError("construction_type")}>
                    {SETTINGS.construction_types.map(c => <option key={c} value={c}>{c}</option>)}
                  </StyledSelect>
                </Field>
                {form.construction_type?.includes("Розбірний") && (
                  <div className="rounded-xl p-3 text-xs" style={{ backgroundColor: "#f2f3f4", border: "1px solid #d4d7da", color: "#383E42" }}>
                    <p className="font-semibold mb-1">&#10003; Переваги розбірного кошика (з 3-х частин):</p>
                    <ul className="list-disc ml-4 space-y-0.5">
                      <li>Дешевша доставка (суцільний варіант перевізник рахує як об'ємну вагу)</li>
                      <li>Зручніше перевезення навіть легковим авто</li>
                      <li>Простіший монтаж та демонтаж</li>
                    </ul>
                  </div>
                )}
                <Field label="Тип кошика *" help="Декоративний підходить для більшості об'єктів. Антивандальний має посилений каркас і рекомендований для нижніх поверхів та громадських місць.">
                  <StyledSelect value={form.basket_type} onChange={v => set("basket_type", v)} placeholder="Оберіть тип" error={fieldError("basket_type")}>
                    {SETTINGS.basket_types.map(b => <option key={b} value={b}>{b}</option>)}
                  </StyledSelect>
                </Field>
                <Field label="Кількість (шт.) *">
                  <StyledInput type="number" min={1} placeholder="Наприклад: 2" value={form.quantity}
                    onChange={e => set("quantity", e.target.value)} error={fieldError("quantity")} />
                </Field>
                <Field label="Верхня кришка" help="Закрита верхня площина кошика. Захищає зовнішній блок зверху від дощу, снігу, листя та сміття. За замовчуванням кошик без кришки.">
                  <div className="grid grid-cols-2 gap-2">
                    {[{ value: false, title: "Без кришки", note: "Стандарт" }, { value: true, title: "З верхньою кришкою", note: "Захист зверху" }].map(option => (
                      <button key={String(option.value)} type="button" onClick={() => set("has_cover", option.value)}
                        className="fx-btn rounded-lg px-3 py-3 text-left"
                        style={{
                          backgroundColor: form.has_cover === option.value ? "#383E42" : "#fff",
                          color: form.has_cover === option.value ? "#fff" : "#383E42",
                          border: form.has_cover === option.value ? "1px solid #383E42" : "1px solid #b8bec2"
                        }}>
                        <span className="block text-xs font-bold">{option.title}</span>
                        <span className="block mt-1" style={{ fontSize: 10, lineHeight: 1.35, opacity: form.has_cover === option.value ? 0.82 : 0.68 }}>{option.note}</span>
                      </button>
                    ))}
                  </div>
                </Field>
              </FormCard>

              {/* Колір */}
              <FormCard title="Колір (RAL) *">
                {fieldError("color") && <div style={{ marginBottom: 8, fontSize: 11, color: "#ef4444", fontWeight: 600 }}>Оберіть колір</div>}
                <div className="grid grid-cols-3 sm:grid-cols-4 gap-3 mb-3">
                  {SETTINGS.colors.filter(c => c.hex).map(c => {
                    const hex = c.hex.toUpperCase();
                    const isLight = hex.startsWith("#F") || hex === "#9DA3A6" || hex === "#E55B13";
                    const selected = form.color === c.label;
                    return (
                      <button key={c.label} type="button" onClick={() => set("color", c.label)}
                        className="color-btn rounded-lg text-xs font-semibold flex items-center justify-center text-center px-1"
                        style={{
                          backgroundColor: c.hex, color: isLight ? "#111" : "#fff",
                          border: selected ? "1px solid #383E42" : `1px solid ${isLight ? "#ccc" : "rgba(255,255,255,0.18)"}`,
                          boxShadow: selected ? "0 0 0 2px #fff, 0 0 0 4px #383E42" : "none",
                          height: "60px", lineHeight: "1.2"
                        }}>
                        {c.label}
                      </button>
                    );
                  })}
                  <button type="button" onClick={() => set("color", "Інші кольори")}
                    className="color-btn rounded-lg text-xs font-semibold bg-gray-100 flex items-center justify-center text-center px-1"
                    style={{
                      color: "#111",
                      border: form.color === "Інші кольори" ? "1px solid #383E42" : "1px solid #ccc",
                      boxShadow: form.color === "Інші кольори" ? "0 0 0 2px rgba(56,62,66,0.4)" : "none",
                      height: "60px"
                    }}>
                    Інші кольори
                  </button>
                </div>
                {(form.color === "Інші кольори" || form.color === "Інший") && (
                  <div className="mt-3 space-y-3 p-4 rounded-xl border" style={{ borderColor: "#383E4240", backgroundColor: "#f4f4f5" }}>
                    <div className="flex items-center gap-2 mb-2">
                      <span style={{ color: "#383E42" }}><IconPalette /></span>
                      <span className="text-xs font-semibold uppercase tracking-wider" style={{ color: "#383E42" }}>Вкажіть колір або код RAL</span>
                    </div>
                    <StyledInput aria-label="Колір або код RAL *" placeholder="Наприклад: RAL 3020, синій, бежевий..." value={form.color_custom}
                      onChange={e => set("color_custom", e.target.value)} error={fieldError("color_custom")} />
                    <details className="optional-details palette-details">
                      <summary className="palette-summary fx-btn">
                        <span className="palette-summary-closed">Палітра кольорів</span>
                        <span className="palette-summary-open">Згорнути палітру кольорів</span>
                        <DisclosureMark />
                      </summary>
                      <div className="metal-palette-grid pb-3">
                        {SETTINGS.metal_palette_images.map((src, i) => (
                          <img key={src} loading="lazy" src={src} alt={`Палітра кольорів металу RAL, сторінка ${i + 1}`} />
                        ))}
                      </div>
                    </details>
                    <p className="text-xs" style={{ color: "#6B7280" }}>Можна вказати назву, код RAL або опис кольору.</p>
                    <p className="text-xs" style={{ color: "#9CA3AF" }}>Зображення в каталозі є візуалізаціями та можуть несуттєво відрізнятися від фактичного виробу.</p>
                  </div>
                )}
              </FormCard>

              {/* Візерунок */}
              <FormCard title="Візерунок *" info="Оберіть варіант на зображенні. Візерунки K3, K4, K6, K8 і K9 мають більше деталей, тому коштують дорожче. Якщо сумніваєтесь, менеджер допоможе після оформлення.">
                <p className="text-xs mb-3" style={{ color: "#6B7280" }}>K3, K4, K6, K8, K9 – дорожче через більшу кількість деталей</p>
                {SETTINGS.pattern_image_url && (
                  <img src={SETTINGS.pattern_image_url} alt="Візерунки" className="w-full rounded-lg mb-4 border" style={{ borderColor: "#383E4240" }} />
                )}
                <StyledSelect aria-label="Візерунок *" value={form.pattern} onChange={v => set("pattern", v)} placeholder="Оберіть візерунок" error={fieldError("pattern")}>
                  {SETTINGS.patterns.map(p => <option key={p} value={p}>{p}</option>)}
                </StyledSelect>
                {form.pattern === "Інший" && (
                  <div className="mt-3 space-y-3 p-4 rounded-xl border" style={{ borderColor: "#383E4240", backgroundColor: "#f4f4f5" }}>
                    <StyledInput placeholder="Опишіть ваш візерунок..." value={form.pattern_custom} onChange={e => set("pattern_custom", e.target.value)} />
                    <div>
                      <p className="text-xs font-semibold uppercase tracking-wider mb-2" style={{ color: "#383E42" }}>Завантажити файл або фото</p>
                      {patternFile ? (
                        <div className="flex items-center gap-3 p-3 rounded-lg border" style={{ borderColor: "#383E4260", backgroundColor: "#fff" }}>
                          <div className="flex-1 text-sm truncate" style={{ color: "#383E42" }}>{patternFile.name}</div>
                          <button type="button" onClick={() => setPatternFile(null)} className="text-gray-400 hover:text-red-500 transition-colors">
                            <IconX />
                          </button>
                        </div>
                      ) : (
                        <label className="upload-zone block cursor-pointer">
                          <input type="file" className="hidden" accept="image/*,.pdf,.dxf,.dwg,.svg,.ai,.eps,.png,.jpg,.jpeg"
                            onChange={e => { if (e.target.files[0]) setPatternFile(e.target.files[0]); }} />
                          <span style={{ color: "#383E42" }}><IconUpload /></span>
                          <p className="text-xs font-medium mt-1" style={{ color: "#383E42" }}>Натисніть або перетягніть файл</p>
                          <p className="text-xs mt-1" style={{ color: "#9CA3AF" }}>JPG, PNG, PDF, SVG, DXF, DWG, AI, EPS</p>
                        </label>
                      )}
                    </div>
                  </div>
                )}
              </FormCard>

              {/* Розміри */}
              <FormCard title="Розміри (мм) *" info="За замовчуванням вкажіть розміри зовнішнього блоку — кошик розрахується автоматично. Також можна перейти до вибору за брендом і моделлю або вказати готовий розмір кошика.">
                {/* Перемикач режиму вводу */}
                <p className="text-xs" style={{ color: "#6B7280" }}>Основний спосіб: <strong>Розміри зовнішнього блоку</strong>. За потреби перейдіть до іншого варіанта.</p>
                <div className="grid grid-cols-3 gap-2 mb-4">
                  {[{ id: "ac", label: "Розміри зовнішнього блоку" }, { id: "model", label: "Бренд + модель" }, { id: "basket", label: "Розмір кошика" }].map(m => (
                    <button key={m.id} type="button" onClick={() => changeSizeMode(m.id)}
                      className="fx-btn py-2 px-1 rounded-lg text-xs font-semibold transition-colors"
                      style={{
                        backgroundColor: sizeMode === m.id ? "#383E42" : "#fff",
                        color: sizeMode === m.id ? "#fff" : "#383E42",
                        border: sizeMode === m.id ? "1px solid #383E42" : "1px solid #d1d5db"
                      }}>
                      {m.label}
                    </button>
                  ))}
                </div>

                {/* Режим А — розмір кошика */}
                {sizeMode === "basket" && (
                  <div className="size-mode-panel">

    function CatalogOrderForm() {
      const baseForm = {
        first_name: "", last_name: "", phone: "", city: "",
        basket_model: "", basket_model_name: "", construction_type: "", basket_type: "",
        quantity: "1", has_cover: false, color: "", color_custom: "", pattern: "", pattern_custom: "", model_comment: "",
        size_w: "", size_h: "", size_d: "", block_w: "", block_h: "", block_d: "",
        ac_brand: "", ac_model: "", ac_model_url: "", bracket_model_from: "", bracket_model_to: "",
        transport: "", transport_custom: "", delivery_address: "", delivery_location: "",
        delivery_date: "", payment_method: "", how_found: "", how_found_custom: "",
        notes: "", terms_accepted: false, referral_source: "direct"
      };
      const [form, setForm] = useState(() => {
        const draft = loadDraft();
        return draft ? { ...baseForm, ...draft, terms_accepted: false } : baseForm;
      });
      const [items, setItems] = useState(() => loadDraftItems());
      const [view, setView] = useState("catalog");
      const [selectedModelId, setSelectedModelId] = useState("");
      const [measureMode, setMeasureMode] = useState("ac");
      const [acDims, setAcDims] = useState({ w: "", h: "", d: "" });
      const [coversBrackets, setCoversBrackets] = useState(null);
      const [patternFile, setPatternFile] = useState(null);
      const [showRalPalette, setShowRalPalette] = useState(false);
      const [visibleRalCount, setVisibleRalCount] = useState(24);
      const [showCalendar, setShowCalendar] = useState(false);
      const [showErrors, setShowErrors] = useState(false);
      const [submitting, setSubmitting] = useState(false);
      const submittingRef = useRef(false);
      const [submitted, setSubmitted] = useState(false);
      const [toast, setToast] = useState(null);

      const selectedModel = CATALOG_MODELS.find(model => model.id === selectedModelId);
      const set = (field, value) => setForm(current => ({ ...current, [field]: value }));
      const scrollTop = () => setTimeout(() => window.scrollTo({ top: 0, behavior: "smooth" }), 0);
      const goTo = (next) => { setView(next); scrollTop(); };

      useEffect(() => {
        try {
          const ref = new URLSearchParams(window.location.search).get("ref");

                    <p className="eyebrow">Завершення</p>
                    <h2 className="text-2xl font-bold">Коментар і підтвердження</h2>
                    <div className="mt-6"><Field label="Коментар або питання"><textarea value={form.notes} onChange={event => set("notes", event.target.value)} placeholder="Наприклад: особливості фасаду, бажаний термін, потрібна допомога з вибором." rows="5" className="catalog-textarea" /></Field></div>
                    <label className={`catalog-check mt-6 ${showErrors && !form.terms_accepted ? "is-error" : ""}`}><input type="checkbox" checked={form.terms_accepted} onChange={event => set("terms_accepted", event.target.checked)} /><span>Я погоджуюсь на зв'язок для прорахунку та ознайомився(лася) з умовами замовлення. *</span></label><ErrorText visible={showErrors && !form.terms_accepted}>Підтвердіть умови, щоб надіслати заявку.</ErrorText>
                    <details className="catalog-disclosure mt-5 border-t pt-4" style={{ borderColor: "#e3e3e6" }}><summary><span>Умови замовлення</span><DisclosureMark /></summary><div className="mt-3"><TermsBlock /></div></details>
                    <div className="mt-7 flex flex-col-reverse gap-3 sm:flex-row sm:items-center sm:justify-between"><a className="catalog-secondary catalog-choice inline-flex items-center justify-center gap-2" href={`tel:${SETTINGS.phone_contact.replace(/\s/g, "")}`}><IconPhone /> Потрібна допомога</a><button type="submit" disabled={submitting} className="catalog-submit catalog-add-to-request">{submitting ? "Надсилання..." : "Надіслати заявку на прорахунок"}</button></div>
                  </section>
                </form>

              </>}
            </main>
          )}
        </div>
      );
    }

    // ============================================================
    // RENDER
    // ============================================================
    ReactDOM.createRoot(document.getElementById("root")).render(<CatalogOrderForm />);
  </script>
